name: flarum-community

services:
  forum:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${FORUM_IMAGE:-flarum-community:latest}
    container_name: flarum-community
    restart: unless-stopped
    ports:
      - '${FORUM_BIND:-127.0.0.1}:${FORUM_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      AUTH_OAUTH_PROVIDERS: ${AUTH_OAUTH_PROVIDERS:-google,facebook,linkedin}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
