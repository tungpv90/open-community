name: Deploy

# Everything runs from here: Actions → Deploy → Run workflow.
# 1. apply database migrations  2. configure Supabase Auth URLs
# 3. build the Docker image on the runner  4. load it on the server and restart  5. health checks
# The image is built here, not on the server: a small server takes over 20 minutes to run next build.
on:
  workflow_dispatch:
    inputs:
      migrate:
        description: Apply database migrations
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.PUBLIC_SITE_URL || 'https://community.apaxsoft.com' }}
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://community.apaxsoft.com' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/open-community' }}
      FORUM_PORT: ${{ vars.FORUM_PORT || '9081' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Check required secrets
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          missing=''
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_ANON_KEY" ] || missing="$missing SUPABASE_ANON_KEY"
          [ -n "$DEPLOY_SSH_KEY$DEPLOY_PASSWORD" ] || missing="$missing DEPLOY_SSH_KEY|DEPLOY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      - name: Apply database migrations
        id: migrate
        if: inputs.migrate
        # Ship the site even when the database step fails; the last step reports it.
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Prefer the Management API: it needs no database password and works over IPv4.
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            ref=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co.*#\1#')
            echo "Applying migrations to project $ref through the Supabase Management API"
            DATABASE_URL='' SUPABASE_PROJECT_REF="$ref" bash scripts/migrate.sh
            exit 0
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Neither SUPABASE_ACCESS_TOKEN nor SUPABASE_DB_URL is set; skipping migrations."
            exit 0
          fi
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq postgresql-client; }

          # Accept a full connection string or just the password; tolerate quotes and KEY= prefixes.
          value=$(printf '%s' "$DATABASE_URL" | tr -d '\r\n' |
            sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/^[A-Z_]+=//; s/^["'\'']//; s/["'\'']$//')
          ref=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co.*#\1#')
          url=''
          case "$value" in
            postgres://*@db.*.supabase.co* | postgresql://*@db.*.supabase.co*)
              # Direct connections are IPv6-only and GitHub runners have no IPv6.
              ref=$(printf '%s' "$value" | sed -E 's#.*@db\.([a-z0-9]+)\.supabase\.co.*#\1#')
              raw=$(printf '%s' "$value" | sed -E 's#^postgres(ql)?://[^:/]+:(.*)@db\.[a-z0-9]+\.supabase\.co.*$#\2#')
              ;;
            postgres://* | postgresql://*)
              url="$value"
              ;;
            *)
              raw="$value"
              ;;
          esac

          if [ -z "$url" ]; then
            echo "::add-mask::$raw"
            uri() { jq -rn --arg value "$1" '$value | @uri'; }
            decode() { jq -rn --arg value "$1" '$value | gsub("%(?<h>[0-9A-Fa-f]{2})"; "\(.h)" | ascii_downcase | explode | map(if . < 97 then . - 48 else . - 87 end) | .[0] * 16 + .[1] | [.] | implode)'; }
            bare="${raw#[}"
            bare="${bare%]}"
            # The password may be URL-encoded already, need encoding, or keep the template's [ ].
            passwords=''
            for candidate in "$(uri "$(decode "$raw")")" "$(uri "$raw")" "$raw" "$(uri "$(decode "$bare")")" "$(uri "$bare")"; do
              case " $passwords " in *" $candidate "*) ;; *) passwords="$passwords $candidate" ;; esac
              echo "::add-mask::$candidate"
            done

            # Find the IPv4 session pooler for this project's region.
            hosts="$POOLER_HOST"
            for region in ap-southeast-1 ap-northeast-1 ap-northeast-2 ap-south-1 ap-southeast-2 \
              us-east-1 us-east-2 us-west-1 us-west-2 ca-central-1 sa-east-1 \
              eu-west-1 eu-west-2 eu-west-3 eu-central-1 eu-central-2 eu-north-1; do
              hosts="$hosts aws-1-$region.pooler.supabase.com aws-0-$region.pooler.supabase.com"
            done
            first=${passwords# }
            first=${first%% *}
            pooler=''
            for host in $hosts; do
              output=$(psql "postgresql://postgres.$ref:$first@$host:5432/postgres?sslmode=require&connect_timeout=8" \
                --no-psqlrc -tAc 'select 1' 2>&1) && { pooler="$host"; break; }
              # "Tenant not found" only means the project lives in another region.
              case "$output" in
                *'not found'* | *'could not translate host'*) ;;
                *) pooler="$host"; break ;;
              esac
            done
            if [ -z "$pooler" ]; then
              echo "::error::No Supabase session pooler knows project $ref. Check SUPABASE_URL."
              exit 1
            fi
            echo "Using the session pooler at $pooler"

            for candidate in $passwords; do
              try="postgresql://postgres.$ref:$candidate@$pooler:5432/postgres?sslmode=require&connect_timeout=8"
              if output=$(psql "$try" --no-psqlrc -tAc 'select 1' 2>&1); then
                url="$try"
                break
              fi
            done
            if [ -z "$url" ]; then
              echo "${output//"$candidate"/***}"
              echo "::error::The database password in SUPABASE_DB_URL was rejected by project $ref. Copy it from Supabase → Project Settings → Database (or reset it there)."
              exit 1
            fi
          fi

          DATABASE_URL="$url" bash scripts/migrate.sh

      - name: Configure Supabase Auth URLs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set; set Site URL and redirect URLs in the Supabase dashboard."
            exit 0
          fi
          ref=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co.*#\1#')
          api="https://api.supabase.com/v1/projects/$ref/config/auth"
          current=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api")
          # Keep existing redirect URLs and add this site's.
          allow=$(printf '%s' "$current" | jq -r --arg site "$PUBLIC_SITE_URL" '
            [(.uri_allow_list // "" | split(",") | map(select(length > 0))),
             [$site, ($site + "/**")]] | add | unique | join(",")')
          jq -n --arg site "$PUBLIC_SITE_URL" --arg allow "$allow" \
            '{site_url: $site, uri_allow_list: $allow}' |
            curl -fsS -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' --data @- "$api" >/dev/null
          echo "Supabase Auth: site_url=$PUBLIC_SITE_URL, redirects=$allow"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set; trusting the key the server presents now."
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          ssh-keygen -lf ~/.ssh/known_hosts
          {
            echo "Host deploy"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  Port $DEPLOY_PORT"
            echo "  StrictHostKeyChecking yes"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          if [ -n "$DEPLOY_SSH_KEY" ]; then
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            echo "  IdentityFile ~/.ssh/deploy_key" >> ~/.ssh/config
            echo "SSH_WRAPPER=" >> "$GITHUB_ENV"
          else
            sudo apt-get install -yq sshpass >/dev/null
            echo "SSH_WRAPPER=sshpass -e" >> "$GITHUB_ENV"
          fi
          chmod 600 ~/.ssh/config

      - name: Detect server architecture
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          arch=$($SSH_WRAPPER ssh deploy uname -m)
          case "$arch" in
            x86_64 | amd64) platform=linux/amd64 ;;
            aarch64 | arm64) platform=linux/arm64 ;;
            *) echo "::error::Unsupported server architecture: $arch"; exit 1 ;;
          esac
          echo "Server architecture: $arch ($platform)"
          echo "IMAGE_PLATFORM=$platform" >> "$GITHUB_ENV"

      - name: Set up QEMU
        if: env.IMAGE_PLATFORM != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          # The Dockerfile also runs the format check, tests and artifact validation.
          docker buildx build --platform "$IMAGE_PLATFORM" --load \
            -t flarum-community:latest -t "flarum-community:${GITHUB_SHA::12}" .
          docker save flarum-community:latest "flarum-community:${GITHUB_SHA::12}" | gzip -1 > image.tar.gz
          ls -lh image.tar.gz

      - name: Package release
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AUTH_OAUTH_PROVIDERS: ${{ vars.AUTH_OAUTH_PROVIDERS || 'google,facebook,linkedin' }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          git archive --format=tar.gz -o release.tar.gz HEAD
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "PUBLIC_SITE_URL=$PUBLIC_SITE_URL"
            echo "AUTH_OAUTH_PROVIDERS=$AUTH_OAUTH_PROVIDERS"
            echo "TURNSTILE_SITE_KEY=$TURNSTILE_SITE_KEY"
            echo "FORUM_BIND=127.0.0.1"
            echo "FORUM_PORT=$FORUM_PORT"
            echo "FORUM_IMAGE=flarum-community:latest"
          } > release.env

      - name: Upload and restart on the server
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          $SSH_WRAPPER scp -C release.tar.gz release.env deploy:/tmp/
          $SSH_WRAPPER scp image.tar.gz deploy:/tmp/open-community-image.tar.gz
          $SSH_WRAPPER ssh deploy \
            DEPLOY_PATH="$DEPLOY_PATH" FORUM_PORT="$FORUM_PORT" sh -s <<'REMOTE'
          set -eu
          case "$DEPLOY_PATH" in
            /*/*) ;;
            *) echo "Refusing to deploy into '$DEPLOY_PATH'; use a dedicated directory." >&2; exit 1 ;;
          esac
          SUDO=''
          [ "$(id -u)" -eq 0 ] || SUDO='sudo'

          if ! command -v docker >/dev/null 2>&1; then
            echo "Installing Docker"
            curl -fsSL https://get.docker.com | $SUDO sh
          fi
          docker info >/dev/null 2>&1 || DOCKER="$SUDO docker"
          DOCKER="${DOCKER:-docker}"

          $SUDO mkdir -p "$DEPLOY_PATH"
          $SUDO chown "$(id -u):$(id -g)" "$DEPLOY_PATH"
          # Replace the source tree so files deleted in the repository disappear on the server.
          find "$DEPLOY_PATH" -mindepth 1 -maxdepth 1 ! -name .env -exec rm -rf {} +
          tar -xzf /tmp/release.tar.gz -C "$DEPLOY_PATH"
          install -m 600 /tmp/release.env "$DEPLOY_PATH/.env"
          rm -f /tmp/release.tar.gz /tmp/release.env

          echo "Loading the image built by the workflow"
          gunzip -c /tmp/open-community-image.tar.gz | $DOCKER load
          rm -f /tmp/open-community-image.tar.gz

          cd "$DEPLOY_PATH"
          $DOCKER compose up -d --no-build --force-recreate --remove-orphans
          for attempt in $(seq 1 40); do
            if $DOCKER compose ps --format '{{.Status}}' | grep -q '(healthy)'; then break; fi
            sleep 3
          done
          $DOCKER compose ps
          if ! curl -fsS --retry 5 --retry-delay 2 --retry-all-errors "http://127.0.0.1:$FORUM_PORT/api/health"; then
            $DOCKER compose logs --tail=100 forum
            exit 1
          fi
          echo

          # A caching reverse proxy would keep serving pages from the previous build; clear it.
          if command -v nginx >/dev/null 2>&1; then
            caches=$($SUDO nginx -T 2>/dev/null |
              sed -nE 's/^[[:space:]]*proxy_cache_path[[:space:]]+([^[:space:];]+).*/\1/p' | sort -u)
            for dir in $caches; do
              case "$dir" in
                /*/*) echo "Clearing nginx cache $dir"; $SUDO find "$dir" -type f -delete ;;
              esac
            done
            [ -n "$caches" ] || echo "nginx has no proxy cache configured"
          fi

          $DOCKER image prune -f >/dev/null
          REMOTE

      - name: Check public site
        run: |
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors "$PUBLIC_SITE_URL/api/health"
          echo
          echo "Deployed to $PUBLIC_SITE_URL"
          home=$(curl -fsS -o /dev/null -D - -H 'Accept-Encoding: gzip, br' "$PUBLIC_SITE_URL/")
          printf '%s\n' "$home" | grep -iE '^(cache-control|x-cache|cf-cache-status):' || true
          if printf '%s' "$home" | grep -qiE '^x-cache: *HIT'; then
            echo "::warning::A proxy served the home page from its cache; visitors may see an old build."
          fi
          if curl -fsS "$PUBLIC_SITE_URL/api/categories" >/dev/null; then
            echo "Database reads work"
          else
            echo "::warning::$PUBLIC_SITE_URL/api/categories failed; check the database schema and SUPABASE_ANON_KEY."
          fi

      - name: Report database migrations
        if: always() && steps.migrate.outcome == 'failure'
        run: |
          echo "::error::The site was deployed, but database migrations failed. See the 'Apply database migrations' step."
          exit 1
